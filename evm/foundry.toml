[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["node_modules"]
solc = "0.8.22"
offline = true
optimizer = true
optimizer_runs = 200
evm_version = "paris"
via_ir = true
fs_permissions = [{ access = "read", path = "./" }]

[fuzz]
runs = 512

[invariant]
runs = 128
depth = 40
fail_on_revert = false
